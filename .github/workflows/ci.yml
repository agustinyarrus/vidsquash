# La CI de vidsquash. Corre donde vidsquash existe, en un Windows de verdad,
# con el Go que declara go.mod: la versión MÍNIMA (1.26.0, sin línea
# toolchain). Si pasa con esa, `go install …@latest` anda con cualquier 1.26.x.
#
# Qué se mira, en orden: formato, go.mod ordenado, vet (también para Linux:
# el planificador compila fuera de Windows), todas las pruebas, que no dejen
# nada en el árbol, el .exe con su versión y su SHA256, y la frontera de ese
# .exe: la ayuda y cada validación de la línea de comandos con su mensaje y su
# código de salida.
#
# Lo que NO mira todavía: codificar un video. vidsquash 0.1.0 nunca corrió
# contra videos reales (docs/PENDIENTE.md); cuando esa prueba exista, se suma
# acá con ffmpeg en el runner.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · formato, vet, pruebas, build y frontera
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      # El Go que instaló setup-go, y ningún otro (sin bajar toolchains).
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Sin dependencias (no hay go.sum) no hay módulos que guardar, y
          # compilar en frío es parte de lo que se prueba.
          cache: false

      - name: La máquina
        timeout-minutes: 2
        continue-on-error: true
        run: |
          go version
          "Windows $([Environment]::OSVersion.Version)"
          "ffmpeg           $(if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { 'sí' } else { 'no' })"
          $global:LASTEXITCODE = 0

      - name: Formato (gofmt)
        run: |
          $mal = @(gofmt -l .)
          if ($mal) {
            gofmt -d .
            foreach ($f in $mal) { "::error file=$($f -replace '\\', '/')::gofmt: sin formato (gofmt -w $f)" }
            exit 1
          }

      - name: go.mod ordenado
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go vet para Linux (el planificador compila fuera de Windows)
        env:
          GOOS: linux
        run: go vet ./...

      - name: Pruebas
        run: ./.github/pruebas.ps1 -Informe "$env:RUNNER_TEMP\pruebas.json"

      - name: Guardar los eventos de las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pruebas-${{ github.sha }}
          path: ${{ runner.temp }}/pruebas.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Las pruebas no dejaron nada en el árbol
        run: |
          $sucio = @(git status --porcelain)
          if ($sucio) { $sucio; '::error::las pruebas dejaron archivos en el repo'; exit 1 }

      - name: build.ps1
        run: |
          # Los acentos y las marcas de build.ps1, en UTF-8 (la consola del runner es OEM).
          try { [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false) } catch { }
          ./build.ps1

      - name: El .exe dice su versión y su commit
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          try { [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false) } catch { }
          $version = [regex]::Match((Get-Content internal/version/version.go -Raw), 'Version\s*=\s*"([^"]+)"').Groups[1].Value
          $quiere = "vidsquash $version+$(git rev-parse --short=7 HEAD)"
          $dice = (./dist/vidsquash.exe --version | Out-String).Trim()
          "vidsquash --version: $dice"
          if ($dice -cne $quiere) { "::error::esperaba '$quiere'"; exit 1 }
          # En una etiqueta, la etiqueta y el código dicen la misma versión.
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") {
            "::error::la etiqueta $env:REF_NAME no es la versión del código (v$version)"
            exit 1
          }

      - name: La frontera del .exe (sin codificar nada)
        run: ./.github/frontera.ps1 -Exe dist/vidsquash.exe

      - name: SHA256SUMS
        run: |
          $h = (Get-FileHash -Algorithm SHA256 dist/vidsquash.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", "$h  vidsquash.exe`n")
          Get-Content dist/SHA256SUMS

      - name: Guardar el .exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vidsquash-${{ github.sha }}
          path: |
            dist/vidsquash.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
